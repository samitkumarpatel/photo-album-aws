name: Build and deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        type: choice
        options: [dev]
        default: dev
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-frontend:
    name: Build and deploy frontend to dev
    runs-on: ubuntu-24.04
    environment:
      name: dev
    concurrency:
      group: deploy-frontend-dev
      cancel-in-progress: false
    env:
      AWS_REGION: eu-north-1
      VITE_API_BASE_URL: https://xltzg907fi.execute-api.eu-north-1.amazonaws.com
      FRONTEND_BUCKET: photo-album-dev-257222191091-frontend
      CLOUDFRONT_DISTRIBUTION_ID: E265JXMW0GJPCK

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assume AWS deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::257222191091:role/samitkumarpatel_photo-album-aws
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend files
        run: |
          aws s3 sync src/main/resources/static/ "s3://${FRONTEND_BUCKET}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp src/main/resources/static/index.html "s3://${FRONTEND_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'
