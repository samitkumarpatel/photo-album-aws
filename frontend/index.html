<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121211" />
    <title>Stillroom — Photo Albums</title>
    <script>
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t) } catch (e) {}
    </script>
    <style>
      /* Shown only until React mounts and replaces #root's content. */
      html { background: #f6f4ef; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #121211; } }
      html[data-theme="dark"] { background: #121211; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #3a57d6; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) .boot { color: #8fa3ff; } }
      html[data-theme="dark"] .boot { color: #8fa3ff; }
      .boot-spinner { position: relative; display: grid; place-items: center; width: 64px; height: 64px; animation: boot-in .3s .2s both; }
      .boot-spinner::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 5px solid currentColor; opacity: .16; }
      .boot-spinner::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 20%, currentColor 95%, transparent 96%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px));
        animation: boot-spin .9s linear infinite; }
      .boot-spinner svg { width: 30px; height: 30px; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-in { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner, .boot-spinner::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Stillroom">
        <span class="boot-spinner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
