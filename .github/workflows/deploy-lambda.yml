name: Build and deploy Lambda

on:
  push:
    branches: [main]
    paths-ignore:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.target_environment || 'dev' }}
    env:
      AWS_REGION: eu-north-1
      DEPLOY_ENV: ${{ inputs.target_environment || 'dev' }}
    outputs:
      ecr_registry: ${{ steps.ecr.outputs.registry }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package JVM application
        run: ./mvnw --batch-mode -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Generate GHCR image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restrict production deploys to main
        if: github.event_name == 'workflow_dispatch' && inputs.target_environment == 'prod'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production deployments must be dispatched from main." >&2
            exit 1
          fi

      - name: Assume AWS deploy role with GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::257222191091:role/samitkumarpatel_photo-album-aws
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images to GHCR and ECR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: |
            ${{ steps.metadata.outputs.tags }}
            ${{ steps.ecr.outputs.registry }}/photo-album-${{ env.DEPLOY_ENV }}-api:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/photo-album-${{ env.DEPLOY_ENV }}-worker:sha-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy API Lambda
    needs: build-and-publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-api-${{ github.ref }}-${{ inputs.target_environment || 'dev' }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.target_environment || 'dev' }}
    env:
      AWS_REGION: eu-north-1
      DEPLOY_ENV: ${{ inputs.target_environment || 'dev' }}
    steps:
      - name: Assume AWS deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::257222191091:role/samitkumarpatel_photo-album-aws
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API Lambda
        run: |
          IMAGE_URI="${{ needs.build-and-publish.outputs.ecr_registry }}/photo-album-${DEPLOY_ENV}-api:sha-${GITHUB_SHA}"
          aws lambda update-function-code \
            --function-name "photo-album-${DEPLOY_ENV}-api" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_REGION"
          aws lambda wait function-updated-v2 \
            --function-name "photo-album-${DEPLOY_ENV}-api" \
            --region "$AWS_REGION"

  deploy-worker:
    name: Deploy worker Lambda
    needs: build-and-publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-worker-${{ github.ref }}-${{ inputs.target_environment || 'dev' }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.target_environment || 'dev' }}
    env:
      AWS_REGION: eu-north-1
      DEPLOY_ENV: ${{ inputs.target_environment || 'dev' }}
    steps:
      - name: Assume AWS deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::257222191091:role/samitkumarpatel_photo-album-aws
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy worker Lambda
        run: |
          IMAGE_URI="${{ needs.build-and-publish.outputs.ecr_registry }}/photo-album-${DEPLOY_ENV}-worker:sha-${GITHUB_SHA}"
          aws lambda update-function-code \
            --function-name "photo-album-${DEPLOY_ENV}-worker" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_REGION"
          aws lambda wait function-updated-v2 \
            --function-name "photo-album-${DEPLOY_ENV}-worker" \
            --region "$AWS_REGION"
