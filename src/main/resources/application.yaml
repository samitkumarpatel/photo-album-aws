
spring:
  application:
    name: photo-album-aws
    # Application settings. Environment variable names stay stable for deployments (Lambda, Terraform).
    data:
      # memory (default, no AWS needed) or dynamodb
      mode: ${PHOTO_ALBUM_DATA_MODE:memory}
      dynamodb:
        table: ${PHOTO_ALBUM_TABLE:photo-album}
    storage:
      # memory (default, no AWS needed) or s3
      mode: ${PHOTO_ALBUM_STORAGE_MODE:memory}
      s3:
        bucket: ${PHOTO_ALBUM_S3_BUCKET:}
        prefix: ${PHOTO_ALBUM_S3_PREFIX:photo-album}
    media:
      # Lifetime of download URLs (S3 presigned GET). Shared albums cap it at the link's expiry.
      url-ttl: ${PHOTO_ALBUM_MEDIA_URL_TTL:6h}
      # Lifetime of presigned upload (PUT) URLs.
      upload-url-ttl: ${PHOTO_ALBUM_UPLOAD_URL_TTL:15m}
    processing:
      # in-process (default): the API makes thumbnails itself on a background thread.
      # events (AWS): S3 notifications feed the worker Lambda through SQS, so the API does nothing.
      mode: ${PHOTO_ALBUM_PROCESSING_MODE:in-process}
    lambda:
      # The native Lambda image serves HTTP for the API and SQS event payloads for the worker.
      role: ${PHOTO_ALBUM_LAMBDA_ROLE:api}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  cloud:
    aws:
      # Spring Cloud AWS builds its AWS clients at startup, so a region must always resolve.
      # Credentials use the SDK default provider chain (IAM role in AWS, a named profile locally).
      region:
        static: ${AWS_REGION:eu-north-1}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
